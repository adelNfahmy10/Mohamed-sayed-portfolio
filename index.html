<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Conference Gallery</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", "Arial", sans-serif;
        background: #fff;
        color: #101828;
      }

      /* Portfolio Section */

      .conference-portfolio {
        position: relative;
        width: 100%;
        padding: 85px 24px 95px;
        overflow: hidden;
        background:
          radial-gradient(
            ellipse at 50% 0%,
            rgba(0, 119, 237, 0.055),
            transparent 48%
          ),
          #ffffff;
      }

      .conference-wrap {
        position: relative;
        width: 100%;
        max-width: 1320px;
        margin: auto;
      }

      /* Header */

      .conference-header {
        text-align: center;
        max-width: 760px;
        margin: 0 auto 52px;
      }

      .conference-header span {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #0077ed;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 3.5px;
        margin-bottom: 20px;
      }

      .conference-header span::before,
      .conference-header span::after {
        content: "";
        width: 24px;
        height: 1px;
        background: #0077ed;
        opacity: 0.55;
      }

      .conference-header h2 {
        color: #101828;
        font-size: clamp(36px, 5vw, 56px);
        font-weight: 800;
        line-height: 1.12;
        letter-spacing: -2.2px;
        margin-bottom: 18px;
      }

      .conference-header h2 strong {
        color: #0077ed;
        font-weight: 800;
      }

      .conference-header p {
        max-width: 590px;
        margin: auto;
        color: #667085;
        font-size: 15px;
        line-height: 1.9;
        font-weight: 400;
      }

      /* Gallery */

      .conference-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
      }

      .conference-card {
        position: relative;
        height: 310px;
        overflow: hidden;
        border-radius: 16px;
        background: #f2f4f7;
        cursor: zoom-in;
        isolation: isolate;
        box-shadow:
          0 4px 15px rgba(16, 24, 40, 0.045),
          0 1px 3px rgba(16, 24, 40, 0.04);
        animation: fadeIn 0.7s ease both;
        transition:
          transform 0.45s ease,
          box-shadow 0.45s ease;
      }

      .conference-card img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      .conference-card::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: inherit;
        pointer-events: none;
      }

      .conference-card::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(
          180deg,
          transparent 55%,
          rgba(5, 15, 30, 0.16) 100%
        );
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none;
      }

      .conference-card:hover {
        transform: translateY(-7px);
        box-shadow:
          0 22px 45px rgba(16, 24, 40, 0.12),
          0 5px 15px rgba(0, 119, 237, 0.08);
      }

      .conference-card:hover img {
        transform: scale(1.075);
      }

      .conference-card:hover::after {
        opacity: 1;
      }

      /* Lightbox */

      .conference-lightbox {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 35px;
        background: rgba(5, 10, 20, 0.96);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.35s ease,
          visibility 0.35s ease;
      }

      .conference-lightbox.open {
        opacity: 1;
        visibility: visible;
      }

      .lightbox-content {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 1250px;
        height: 100%;
        transform: scale(0.94) translateY(10px);
        transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      .conference-lightbox.open .lightbox-content {
        transform: scale(1) translateY(0);
      }

      .lightbox-image {
        display: block;
        max-width: 100%;
        max-height: 84vh;
        object-fit: contain;
        border-radius: 10px;
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
      }

      /* Lightbox Controls */

      .lightbox-close,
      .lightbox-prev,
      .lightbox-next {
        position: absolute;
        z-index: 5;
        display: grid;
        place-items: center;
        width: 50px;
        height: 50px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.09);
        color: #fff;
        font-size: 30px;
        font-weight: 300;
        cursor: pointer;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: all 0.3s ease;
      }

      .lightbox-close:hover,
      .lightbox-prev:hover,
      .lightbox-next:hover {
        background: #0077ed;
        border-color: #0077ed;
        box-shadow: 0 0 25px rgba(0, 119, 237, 0.35);
        transform: scale(1.08);
      }

      .lightbox-close {
        top: 15px;
        right: 15px;
      }

      .lightbox-prev {
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
      }

      .lightbox-prev:hover {
        transform: translateY(-50%) scale(1.08);
      }

      .lightbox-next {
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
      }

      .lightbox-next:hover {
        transform: translateY(-50%) scale(1.08);
      }

      /* Animation */

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Tablet */

      @media (max-width: 991px) {
        .conference-portfolio {
          padding: 65px 22px 75px;
        }

        .conference-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 18px;
        }

        .conference-card {
          height: 280px;
        }

        .conference-header {
          margin-bottom: 40px;
        }
      }

      /* Mobile */

      @media (max-width: 600px) {
        .conference-portfolio {
          padding: 48px 16px 55px;
        }

        .conference-header {
          margin-bottom: 30px;
        }

        .conference-header span {
          font-size: 10px;
          letter-spacing: 2.5px;
          margin-bottom: 15px;
        }

        .conference-header h2 {
          font-size: 35px;
          letter-spacing: -1.5px;
          margin-bottom: 13px;
        }

        .conference-header p {
          font-size: 13px;
          line-height: 1.8;
        }

        .conference-grid {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .conference-card {
          height: 270px;
          border-radius: 13px;
        }

        .conference-card:hover {
          transform: none;
        }

        .conference-lightbox {
          padding: 12px;
        }

        .lightbox-image {
          max-height: 75vh;
          border-radius: 7px;
        }

        .lightbox-close {
          top: 12px;
          right: 12px;
        }

        .lightbox-prev {
          left: 5px;
        }

        .lightbox-next {
          right: 5px;
        }

        .lightbox-close,
        .lightbox-prev,
        .lightbox-next {
          width: 40px;
          height: 40px;
          font-size: 24px;
        }
      }

      /* Reduced Motion */

      @media (prefers-reduced-motion: reduce) {
        .conference-card,
        .conference-card img,
        .conference-lightbox,
        .lightbox-content,
        .lightbox-close,
        .lightbox-prev,
        .lightbox-next {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>

  <body>

    <!-- Lightbox -->

    <div class="conference-lightbox" id="conferenceLightbox" aria-hidden="true">
      <div class="lightbox-content">
        <button class="lightbox-close" id="lightboxClose" aria-label="Close">
          ×
        </button>

        <button class="lightbox-prev" id="lightboxPrev" aria-label="Previous">
          ‹
        </button>

        <img class="lightbox-image" id="lightboxImage" src="" alt="" />

        <button class="lightbox-next" id="lightboxNext" aria-label="Next">
          ›
        </button>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const cards = Array.from(document.querySelectorAll(".conference-card"));

        const lightbox = document.getElementById("conferenceLightbox");
        const lightboxImage = document.getElementById("lightboxImage");

        const closeButton = document.getElementById("lightboxClose");
        const prevButton = document.getElementById("lightboxPrev");
        const nextButton = document.getElementById("lightboxNext");

        let currentIndex = 0;

        function openLightbox(index) {
          currentIndex = index;
          updateLightbox();

          lightbox.classList.add("open");
          lightbox.setAttribute("aria-hidden", "false");
          document.body.style.overflow = "hidden";
        }

        function updateLightbox() {
          const image = cards[currentIndex].querySelector("img");

          lightboxImage.src = image.src;
          lightboxImage.alt = image.alt;
        }

        function closeLightbox() {
          lightbox.classList.remove("open");
          lightbox.setAttribute("aria-hidden", "true");
          document.body.style.overflow = "";
        }

        function previousImage() {
          currentIndex = (currentIndex - 1 + cards.length) % cards.length;

          updateLightbox();
        }

        function nextImage() {
          currentIndex = (currentIndex + 1) % cards.length;

          updateLightbox();
        }

        cards.forEach(function (card, index) {
          card.addEventListener("click", function () {
            openLightbox(index);
          });
        });

        closeButton.addEventListener("click", closeLightbox);
        prevButton.addEventListener("click", previousImage);
        nextButton.addEventListener("click", nextImage);

        lightbox.addEventListener("click", function (event) {
          if (event.target === lightbox) {
            closeLightbox();
          }
        });

        document.addEventListener("keydown", function (event) {
          if (!lightbox.classList.contains("open")) return;

          if (event.key === "Escape") closeLightbox();
          if (event.key === "ArrowLeft") previousImage();
          if (event.key === "ArrowRight") nextImage();
        });
      });
    </script>
