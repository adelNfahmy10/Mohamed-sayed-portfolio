<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Conference Gallery</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #fff;
      }

      .conference-portfolio {
        width: 100%;
        padding: 50px 20px;
        background: #fff;
      }

      .conference-wrap {
        width: 100%;
        max-width: 1240px;
        margin: auto;
      }

      /* Gallery */

      .conference-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px;
      }

      .conference-card {
        position: relative;
        height: 290px;
        overflow: hidden;
        border-radius: 12px;
        background: #f1f3f5;
        cursor: pointer;
        animation: fadeIn 0.5s ease both;
      }

      .conference-card img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s ease;
      }

      .conference-card:hover img {
        transform: scale(1.07);
      }

      .conference-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0);
        transition: background 0.3s ease;
        pointer-events: none;
      }

      .conference-card:hover::after {
        background: rgba(0, 0, 0, 0.12);
      }

      /* Lightbox */

      .conference-lightbox {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 25px;
        background: rgba(0, 0, 0, 0.95);
        opacity: 0;
        visibility: hidden;
        transition: 0.3s ease;
      }

      .conference-lightbox.open {
        opacity: 1;
        visibility: visible;
      }

      .lightbox-content {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 1100px;
        height: 100%;
        transform: scale(0.95);
        transition: 0.3s ease;
      }

      .conference-lightbox.open .lightbox-content {
        transform: scale(1);
      }

      .lightbox-image {
        display: block;
        max-width: 100%;
        max-height: 85vh;
        object-fit: contain;
        border-radius: 6px;
      }

      /* Controls */

      .lightbox-close,
      .lightbox-prev,
      .lightbox-next {
        position: absolute;
        z-index: 5;
        display: grid;
        place-items: center;
        width: 45px;
        height: 45px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 27px;
        cursor: pointer;
        transition: 0.25s ease;
      }

      .lightbox-close:hover,
      .lightbox-prev:hover,
      .lightbox-next:hover {
        background: #0077ed;
        border-color: #0077ed;
      }

      .lightbox-close {
        top: 15px;
        right: 15px;
      }

      .lightbox-prev {
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
      }

      .lightbox-next {
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
      }

      /* Responsive */

      @media (max-width: 991px) {
        .conference-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px;
        }

        .conference-card {
          height: 260px;
        }
      }

      @media (max-width: 600px) {
        .conference-portfolio {
          padding: 30px 14px;
        }

        .conference-grid {
          grid-template-columns: 1fr;
          gap: 15px;
        }

        .conference-card {
          height: 280px;
        }

        .conference-lightbox {
          padding: 12px;
        }

        .lightbox-image {
          max-height: 75vh;
        }

        .lightbox-close {
          top: 10px;
          right: 10px;
        }

        .lightbox-prev {
          left: 8px;
        }

        .lightbox-next {
          right: 8px;
        }

        .lightbox-close,
        .lightbox-prev,
        .lightbox-next {
          width: 38px;
          height: 38px;
          font-size: 23px;
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

    <!-- Lightbox -->

    <div class="conference-lightbox" id="conferenceLightbox" aria-hidden="true">
      <div class="lightbox-content">
        <button class="lightbox-close" id="lightboxClose" aria-label="Close">
          ×
        </button>

        <button class="lightbox-prev" id="lightboxPrev" aria-label="Previous">
          ‹
        </button>

        <img class="lightbox-image" id="lightboxImage" src="" alt="" />

        <button class="lightbox-next" id="lightboxNext" aria-label="Next">
          ›
        </button>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const cards = Array.from(document.querySelectorAll(".conference-card"));

        const lightbox = document.getElementById("conferenceLightbox");
        const lightboxImage = document.getElementById("lightboxImage");

        const closeButton = document.getElementById("lightboxClose");
        const prevButton = document.getElementById("lightboxPrev");
        const nextButton = document.getElementById("lightboxNext");

        let currentIndex = 0;

        function openLightbox(index) {
          currentIndex = index;
          updateLightbox();

          lightbox.classList.add("open");
          lightbox.setAttribute("aria-hidden", "false");
          document.body.style.overflow = "hidden";
        }

        function updateLightbox() {
          const image = cards[currentIndex].querySelector("img");

          lightboxImage.src = image.src;
          lightboxImage.alt = image.alt;
        }

        function closeLightbox() {
          lightbox.classList.remove("open");
          lightbox.setAttribute("aria-hidden", "true");
          document.body.style.overflow = "";
        }

        function previousImage() {
          currentIndex = (currentIndex - 1 + cards.length) % cards.length;

          updateLightbox();
        }

        function nextImage() {
          currentIndex = (currentIndex + 1) % cards.length;

          updateLightbox();
        }

        cards.forEach(function (card, index) {
          card.addEventListener("click", function () {
            openLightbox(index);
          });
        });

        closeButton.addEventListener("click", closeLightbox);
        prevButton.addEventListener("click", previousImage);
        nextButton.addEventListener("click", nextImage);

        lightbox.addEventListener("click", function (event) {
          if (event.target === lightbox) {
            closeLightbox();
          }
        });

        document.addEventListener("keydown", function (event) {
          if (!lightbox.classList.contains("open")) return;

          if (event.key === "Escape") closeLightbox();
          if (event.key === "ArrowLeft") previousImage();
          if (event.key === "ArrowRight") nextImage();
        });
      });
    </script>
